name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --lib --bins

  deploy:
    name: Deploy Lambda
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig cross-compiler
        run: pip3 install ziglang

      - name: Install cargo-lambda
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018532615177:role/lepre-api-deployer
          aws-region: eu-west-1

      - name: Build Lambda binary (arm64)
        run: cargo lambda build --release --arm64

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name lepre-api \
            --zip-file fileb://target/lambda/bootstrap/bootstrap.zip
