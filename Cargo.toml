[package]
name = "lepre-api"
version = "0.2.0"
edition = "2024"

[lib]
name = "lepre_api"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
http = "1"
lambda_http = "0.13"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.aws-config]
version = "1"
default-features = false
features = ["behavior-version-latest", "rustls"]

[dependencies.aws-sdk-ssm]
version = "1"
default-features = false
features = ["behavior-version-latest", "rustls"]

[dependencies.aws-sdk-dynamodb]
version = "1"
default-features = false
features = ["behavior-version-latest", "rustls"]

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
